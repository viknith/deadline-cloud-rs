name: Python Tests (bindings + UI conformance)

on:
  pull_request:
    paths:
      - "crates/**"
      - "gui/**"
      - "pytests/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  QT_ACCESSIBILITY: "1"
  PYTHON_REPO: aws-deadline/deadline-cloud
  PYTHON_REF: mainline

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Bindings: tests the raw deadline._native PyO3 API (Rust-repo specific)
  # ──────────────────────────────────────────────────────────────────────
  bindings:
    name: Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Map *.localhost prefixes to loopback (Unix)
        if: runner.os != 'Windows'
        run: echo "127.0.0.1 management.localhost scheduling.localhost" | sudo tee -a /etc/hosts
      - name: Map *.localhost prefixes to loopback (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 management.localhost scheduling.localhost"

      - name: Build Rust workspace
        run: cargo build --workspace

      - name: Install Python deps + build extension
        run: |
          pip install maturin
          python -c "import os; os.makedirs('deadline.data/scripts', exist_ok=True); open('deadline.data/scripts/deadline', 'w').close()"
          pip install -e ".[test]"

      - name: Run binding tests
        run: python -m pytest pytests/bindings/ -v

  # ──────────────────────────────────────────────────────────────────────
  # UI conformance: install our Rust-backed deadline package, then run
  # deadline-cloud-python's test/ui/ suite against it.
  #
  # How it works:
  #   1. pip install -e . installs our gui/ as the "deadline" package and
  #      puts the Rust binary in the venv's bin/.
  #   2. We clone the Python repo just for its test files.
  #   3. DEADLINE_BINARY points the tests at the Rust binary.
  #   4. /etc/hosts maps management.localhost -> 127.0.0.1 so the AWS
  #      SDK's host-prefix resolves to the mock server.
  # ──────────────────────────────────────────────────────────────────────
  ui-conformance-linux:
    name: UI conformance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deadline-cloud-rs
        uses: actions/checkout@v4
        with:
          path: deadline-cloud-rs

      - name: Checkout deadline-cloud-python (test files only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PYTHON_REPO }}
          ref: ${{ env.PYTHON_REF }}
          path: deadline-cloud-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Map *.localhost prefixes to loopback
        run: echo "127.0.0.1 management.localhost scheduling.localhost" | sudo tee -a /etc/hosts

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb dbus dbus-x11 at-spi2-core \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-xkb1 libegl1 libglib2.0-0 libfontconfig1 \
            libdbus-1-3 libx11-xcb1 libxcb-render0 libxcb-shape0 \
            libxcb-xfixes0

      - name: Build Rust binary
        working-directory: deadline-cloud-rs
        run: cargo build -p deadline-cli

      - name: Install deadline package + test deps
        working-directory: deadline-cloud-rs
        run: |
          pip install maturin
          mkdir -p deadline.data/scripts && touch deadline.data/scripts/deadline
          pip install -e ".[gui]"
          pip install -r ../deadline-cloud-python/requirements-ui-testing.txt
          pip install botocore boto3 "moto[server,s3]"

      - name: Run UI tests under Xvfb + AT-SPI
        working-directory: deadline-cloud-python
        env:
          DEADLINE_BINARY: ${{ github.workspace }}/deadline-cloud-rs/target/debug/deadline
        run: |
          dbus-run-session -- bash -c '
            set -e
            Xvfb :99 -screen 0 1280x1024x24 -ac &
            export DISPLAY=:99
            sleep 1

            export QT_ACCESSIBILITY=1
            export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1

            /usr/libexec/at-spi-bus-launcher --launch-immediately &
            sleep 1
            /usr/libexec/at-spi2-registryd &
            sleep 1

            python -m pytest \
              -o "addopts=" \
              -p no:cacheprovider \
              --no-cov \
              -vvv --numprocesses=1 \
              --timeout=120 \
              test/ui/
          '

  ui-conformance-macos:
    name: UI conformance (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout deadline-cloud-rs
        uses: actions/checkout@v4
        with:
          path: deadline-cloud-rs

      - name: Checkout deadline-cloud-python (test files only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PYTHON_REPO }}
          ref: ${{ env.PYTHON_REF }}
          path: deadline-cloud-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Map *.localhost prefixes to loopback
        run: echo "127.0.0.1 management.localhost scheduling.localhost" | sudo tee -a /etc/hosts

      - name: Build Rust binary
        working-directory: deadline-cloud-rs
        run: cargo build -p deadline-cli

      - name: Install deadline package + test deps
        working-directory: deadline-cloud-rs
        run: |
          pip install maturin
          mkdir -p deadline.data/scripts && touch deadline.data/scripts/deadline
          pip install -e ".[gui]"
          pip install -r ../deadline-cloud-python/requirements-ui-testing.txt
          pip install botocore boto3 "moto[server,s3]"

      - name: Grant accessibility TCC permission
        run: |
          PYTHON_PATH=$(python -c "import os,sys; print(os.path.realpath(sys.executable))")
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) \
            VALUES('kTCCServiceAccessibility','${PYTHON_PATH}',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
          sudo launchctl stop com.apple.tccd 2>/dev/null || true
          sleep 2

      - name: Run UI tests
        working-directory: deadline-cloud-python
        env:
          DEADLINE_BINARY: ${{ github.workspace }}/deadline-cloud-rs/target/debug/deadline
          QT_ACCESSIBILITY: "1"
        run: |
          python -m pytest \
            -o "addopts=" \
            -p no:cacheprovider \
            --no-cov \
            -vvv --numprocesses=1 \
            --timeout=120 \
            test/ui/

  ui-conformance-windows:
    name: UI conformance (Windows)
    runs-on: windows-latest
    steps:
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Checkout deadline-cloud-rs
        uses: actions/checkout@v4
        with:
          path: deadline-cloud-rs

      - name: Checkout deadline-cloud-python (test files only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PYTHON_REPO }}
          ref: ${{ env.PYTHON_REF }}
          path: deadline-cloud-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Map *.localhost prefixes to loopback
        shell: pwsh
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 management.localhost scheduling.localhost"

      - name: Build Rust binary
        working-directory: deadline-cloud-rs
        run: cargo build -p deadline-cli

      - name: Install deadline package + test deps
        working-directory: deadline-cloud-rs
        run: |
          pip install maturin
          mkdir -p deadline.data/scripts && touch deadline.data/scripts/deadline
          pip install -e ".[gui]"
          pip install -r ../deadline-cloud-python/requirements-ui-testing.txt
          pip install botocore boto3 "moto[server,s3]"

      - name: Run UI tests
        working-directory: deadline-cloud-python
        env:
          DEADLINE_BINARY: ${{ github.workspace }}\deadline-cloud-rs\target\debug\deadline.exe
          QT_ACCESSIBILITY: "1"
        run: |
          python -m pytest `
            -o "addopts=" `
            -p no:cacheprovider `
            --no-cov `
            -vvv --numprocesses=1 `
            --timeout=120 `
            test/ui/
